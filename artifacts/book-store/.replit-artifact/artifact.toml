kind = "web"
previewPath = "/"
title = "تحت راية الطوفان — Book Order"
version = "1.0.0"
id = "artifacts/book-store"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19786

[services.development]
run = "pnpm --filter @workspace/book-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/book-store", "run", "build" ]
serve = "static"
publicDir = "artifacts/book-store/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19786"
BASE_PATH = "/"

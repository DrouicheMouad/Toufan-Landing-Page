services:
  - type: web
    name: toufan-api
    env: node
    region: frankfurt
    plan: free
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: GUEPEX_API_ID
        sync: false
      - key: GUEPEX_API_TOKEN
        sync: false
      - key: SESSION_SECRET
        sync: false

  - type: web
    name: toufan-frontend
    env: static
    region: frankfurt
    plan: free
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && PORT=3000 BASE_PATH=/ pnpm --filter @workspace/book-store run build
    staticPublishPath: artifacts/book-store/dist/public
    routes:
      - type: rewrite
        source: /api/*
        destination: https://toufan-api.onrender.com/api/:splat
      - type: rewrite
        source: /*
        destination: /index.html
